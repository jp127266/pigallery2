name: pigallery2

services:
  pigallery2:
    # Custom build of 3.5.2 with local patches, built from ./pigallery2-src
    # (see pigallery2-src/Dockerfile.custom):
    #   - lightbox previews sized to physical pixels (no blurry HiDPI previews)
    #   - lightbox close key changed from Escape to 'x'
    #
    # `docker compose up -d` builds this automatically when the image is not
    # present, so a fresh clone needs no separate build step. An image that
    # already exists is reused as-is; force a rebuild after editing the source
    # with `docker compose up -d --build`.
    build:
      context: pigallery2-src
      dockerfile: Dockerfile.custom
    image: pigallery2:custom-3.5.2
    container_name: pigallery2
    environment:
      - NODE_ENV=production
    volumes:
      - ./config:/app/data/config
      - ./db:/app/data/db
      # Generated thumbnails / screen-sized previews live here (the speed cache)
      - ./tmp:/app/data/tmp
      # Your photos, READ-ONLY (PiGallery2 never modifies originals).
      # Set PHOTOS_DIR in .env (see .env.example); the default below is only
      # the original host's path, kept so that machine works without a .env.
      - ${PHOTOS_DIR:-/home/jp127266/Codes/vripper/download}:/app/data/images:ro
    ports:
      - "${HTTP_PORT:-8082}:80"
    restart: unless-stopped
